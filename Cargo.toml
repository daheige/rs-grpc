[package]
name = "rs-grpc"
version = "0.1.4"
edition = "2024"

[[bin]]
name = "rs-rpc-client"
path = "src/client.rs"

[[bin]]
name = "rs-grpc-gateway"
path = "gateway/main.rs"

[[bin]]
name = "rs-multiplex-svc"
path = "src/multiplex_server.rs"

[dependencies]
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"

# 异步运行时相关依赖
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"

# axum用于http服务
axum = "0.8.9"

serde = { version = "1.0.229", features = ["derive"] }
#serde_json = "1.0.149"

# 配置文件读取以及用于消息序列化和反序列化处理
serde_yaml = "0.9.33"
once_cell = "1.21.4"

# autometrics-rs 用于自动prometheus metrics服务可观测性
autometrics = { version = "3.0.0", features = ["prometheus-exporter"] }

# 用于将grpc服务和http服务运行在一个端口上面
tower = { version = "0.5.3", features = ["steer"] }

# 操作日志
log = "0.4.33"
#env_logger = { version = "0.11.10", features = ["color"] }

# tracing追踪
#tracing = "0.1"
#tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# chrono用于时间处理
chrono = "0.4.45"

# 引入基础组件库hera
config = { git = "https://github.com/rs-god/hera", tag = "v1.2.4" }
logger = { git = "https://github.com/rs-god/hera", tag = "v1.2.4" }
monitor = { git = "https://github.com/rs-god/hera", tag = "v1.2.4" }
shutdown = { git = "https://github.com/rs-god/hera", tag = "v1.2.4" }

[build-dependencies]
# note: Must be the same as the tonic version
tonic-prost-build = "0.14.6"
